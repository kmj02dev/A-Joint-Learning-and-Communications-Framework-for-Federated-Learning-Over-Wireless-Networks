# Runtime override consumed by main.py. Values under figures may be scalars
# or lists. Lists define the experiment candidates to run from this YAML.
seed: [0, 42, 1004]

# Values below are not stated explicitly in the paper. Keep only those values
# sweepable; paper-fixed parameters remain in main.py defaults.
wireless:
  interference_w: [3e-8]
  # RB-specific uplink interference vectors from mzchen0/Wireless-FL FLMIN.m.
  # The original R=9 and R=12 vectors contain a negative first value; clamp it to zero.
  interference_w_by_rbs:
    3: [1.0e-8, 6.0e-8, 1.0e-7]
    6: [1.0e-8, 3.0e-8, 5.0e-8, 7.0e-8, 9.0e-8, 1.1e-7]
    9: [0.0, 2.0e-8, 3.0e-8, 4.0e-8, 6.0e-8, 7.0e-8, 8.0e-8, 1.0e-7, 1.1e-7]
    12: [0.0, 1.0e-8, 2.0e-8, 3.0e-8, 4.0e-8, 5.0e-8, 6.0e-8, 7.0e-8, 8.0e-8, 9.0e-8, 1.0e-7, 1.1e-7]
  downlink_interference_w: [1.8e-7]
  min_distance_m: [0.0]
  interference_lognormal_sigma: [0.0]
  rate_floor: [1.0e-12]
  channel_gain_floor: [1.0e-18]
  snr_denominator_floor: [1.0e-18]
  power_floor_w: [1.0e-12]
  power_solver_maxiter: [50]
  heuristic_max_rbs: [20]

training:
  # FLMIN.m uses Z = 39760 * 16 bits for the MNIST FNN model.
  # Use null to fall back to each parameter tensor's actual dtype size.
  quantization_bits: [16]
  eval_batch_size: [256]
  # Use [mse], [nmse], or [mse, nmse] to choose the regression training loss.
  regression_loss: [nmse]
  regression_scale_floor: [1.0e-12]

figures:
  figure_3:
    # Fig. 3 does not state the exact number of red-cross regression samples.
    data_count: [50]
    test_count: [1000]
    rounds: [130]
    num_rbs: [9]
    local_epochs: [1]
    batch_size: [50]
    activation: [identity]
    learning_rate: [0.01]
  figure_4:
    # sample_counts is itself a list-valued parameter, so use list-of-lists.
    sample_counts:
      - [10, 20, 30, 40, 50]
    rounds: [130]
    num_rbs: [9]
    local_epochs: [1]
    batch_size: [50]
    activation: [identity]
    learning_rate: [0.01]
    average_seeds: [0, 42, 1004]
  figure_5:
    user_counts:
      - [3, 6, 10, 15, 20, 25]
    rb_counts:
      - [10, 15]
    average_seeds: [0, 42, 1004]
  figure_6:
    user_counts:
      - [3, 6, 9, 12, 15, 18]
    num_rbs: [12]
    # FLMIN.m datanumber prefix values; Fig. 6 varies the total number of users.
    samples_per_user:
      - [100, 200, 300, 400, 500, 400, 300, 200, 100, 200, 300, 400, 500, 600, 100, 200, 300, 400]
    # FLMIN.m uses Z = 39760 * 16 bits.
    model_parameters: [39760]
    waterfall_threshold: [1.08]
    simulation_trials: [2000]
    measure_actual_gap: [true]
    measured_gap_trials: [1]
    measurement_task: [mnist]
    test_samples: [1000]
    rounds: [130]
    gstar_rounds: [130]
    local_epochs: [1]
    batch_size: [600]
    learning_rate: [0.08]
    # Theorem 1 constants are not specified by the paper or FLMIN.m.
    strong_convexity_mu: [0.1]
    lipschitz_l: [1.0]
    gradient_bound_zeta1: [4.225]
    gradient_bound_zeta2: [0.480]
    average_seeds: [76, 125, 93]
  figure_7:
    # FLMIN.m datanumber values for the 15-user MNIST FNN experiment.
    samples_per_user:
      - [100, 200, 300, 400, 500, 400, 300, 200, 100, 200, 300, 400, 500, 600, 100]
    test_samples: [1000]
    rounds: [130]
    num_rbs: [12]
    local_epochs: [1]
    batch_size: [32]
    learning_rate: [0.08]
    # FLMIN.m averages three independent FL implementations.
    average_seeds: [0, 42, 1004]
  figure_8:
    user_counts:
      - [3, 6, 9, 12, 15, 18]
    # FLMIN.m datanumber prefix values; Fig. 8 varies the total number of users.
    samples_per_user:
      - [100, 200, 300, 400, 500, 400, 300, 200, 100, 200, 300, 400, 500, 600, 100, 200, 300, 400]
    test_samples: [1000]
    rounds: [130]
    num_rbs: [12]
    local_epochs: [1]
    batch_size: [32]
    learning_rate: [0.08]
    # FLMIN.m averages three independent FL implementations.
    average_seeds: [0, 42, 1004]
  figure_9:
    rb_counts:
      - [3, 6, 9, 12]
    # FLMIN.m datanumber values for the 15-user MNIST FNN experiment.
    samples_per_user:
      - [100, 200, 300, 400, 500, 400, 300, 200, 100, 200, 300, 400, 500, 600, 100]
    test_samples: [1000]
    rounds: [130]
    local_epochs: [1]
    batch_size: [32]
    learning_rate: [0.08]
    # FLMIN.m averages three independent FL implementations.
    average_seeds: [0, 42, 1004]
